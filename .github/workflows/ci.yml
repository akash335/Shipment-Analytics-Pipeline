name: Shipment Analytics CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: |
          python -m compileall -q src airflow/dags

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-postgres==1.11.0

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'PROFILE'
          shipment_analytics:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                user: ci
                password: ci
                port: 5432
                dbname: shipment_db
                schema: public
                threads: 2
          PROFILE

      - name: Validate dbt project
        working-directory: dbt/shipment_analytics/shipment_analytics
        run: |
          dbt parse --no-partial-parse
